<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桐城中学--叶老师教学</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            line-height: 1.8;
            color: #333;
            background: #f0f2f5;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 0;
            background: linear-gradient(135deg, #5c0000 0%, #8B0000 20%, #C41E3A 50%, #8B0000 80%, #5c0000 100%);
            color: white;
            position: relative;
            overflow: hidden;
            min-height: 166px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(139,0,0,0.5);
        }
        /* 红金纹理背景 */
        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255,215,0,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255,215,0,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(255,100,0,0.1) 0%, transparent 60%);
            pointer-events: none;
        }
        /* 顶部装饰线 */
        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
        }
        .header-content {
            position: relative;
            z-index: 1;
            padding: 22px 10mm 15px;
            width: 100%;
            max-width: 100%;
        }
        .motto {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: clamp(60px, 9.8vw, 166px);
            color: #FFD700;
            text-shadow: 0 0 18px rgba(255,215,0,0.8), 0 0 36px rgba(255,165,0,0.6), 0 4px 6px rgba(0,0,0,0.4);
            letter-spacing: 13px;
            line-height: 1.05;
            white-space: nowrap;
            font-weight: normal;
        }
        .header-bg-img {
            position: absolute;
            right: 0;
            bottom: 0;
            height: 100%;
            width: auto;
            object-fit: contain;
            object-position: right bottom;
            pointer-events: none;
            z-index: 1;
        }
        .header-bottom-border {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
        }
        .container { max-width: 100%; margin: 0; padding: 30px 20px; }
        .two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 190px); }
        @media (max-width: 900px) { .two-columns { grid-template-columns: 1fr; } }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; height: 100%; display: flex; flex-direction: column; }
        .card-header { padding: 20px 25px; font-size: 1.3em; font-weight: 600; display: flex; align-items: center; gap: 10px; color: white; }
        .homework-header { background: linear-gradient(135deg, #667eea, #764ba2); }
        .answer-header { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .card-body { padding: 25px; flex: 1; overflow-y: auto; }

        h3 { color: #667eea; margin: 18px 0 8px; font-size: 3.0em; } #改标题大小
        
        h3:first-child { margin-top: 0; }
        
        .hw-text { font-size: 2.5em; line-height: 2; color: #000; } #改内容文字大小
        
        .answer-content { display: flex; flex-direction: column; gap: 16px; }
        .answer-item { background: #f8f9fa; border-radius: 8px; padding: 15px; border-left: 4px solid #11998e; }
        .answer-item h4 { color: #11998e; margin-bottom: 10px; font-size: 1em; }
        .ans-text { background: #e8f5e9; padding: 12px 15px; border-radius: 6px; font-family: Consolas, Monaco, monospace; font-size: 0.95em; color: #d32f2f; line-height: 1.6; }
        .zoom-img { max-width: 100%; border-radius: 6px; cursor: pointer; transition: transform 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .zoom-img:hover { transform: scale(1.02); box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; justify-content: center; align-items: center; }
        #overlay.show { display: flex; }
        #overlay .img-wrapper { position: relative; max-width: 98vw; max-height: 98vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #overlay img { max-width: 98vw; max-height: 85vh; object-fit: contain; border-radius: 4px; cursor: default; transition: transform 0.2s; }
        #overlay .zoom-bar { position: fixed; top: 70px; right: 76px; z-index: 10001; display: flex; align-items: center; gap: 15px; }
        #overlay .zoom-btn { background: rgba(255,255,255,0.2); color: white; border: none; font-size: 24px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: background 0.2s; }
        #overlay .zoom-btn:hover { background: rgba(255,255,255,0.4); }
        #overlay .zoom-level { color: white; font-size: 16px; min-width: 60px; text-align: center; }
        #overlay .nav-bar { position: fixed; bottom: 20px; right: 76px; z-index: 10001; display: flex; align-items: center; justify-content: center; gap: 30px; }
        #overlay .nav-btn { background: rgba(255,255,255,0.15); color: white; border: none; font-size: 18px; padding: 8px 24px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        #overlay .nav-btn:hover { background: rgba(255,255,255,0.3); }
        #overlay .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #overlay .page-indicator { color: rgba(255,255,255,0.7); font-size: 15px; }
        #overlay .close-btn { position: fixed; top: 20px; right: 30px; color: white; font-size: 36px; cursor: pointer; opacity: 0.7; z-index: 10000; line-height: 1; }
        #overlay .close-btn:hover { opacity: 1; }
        #overlay canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: auto; cursor: crosshair; }
        #overlay .draw-toolbar { position: fixed; top: 20px; left: 20px; z-index: 10002; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        #overlay .draw-toolbar .dt-btn { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.2s; white-space: nowrap; }
        #overlay .draw-toolbar .dt-btn:hover { background: rgba(255,255,255,0.3); }
        #overlay .draw-toolbar .dt-btn.active { background: rgba(255,215,0,0.6); border-color: #FFD700; }
        #overlay .draw-toolbar input[type=color] { width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; cursor: pointer; background: transparent; padding: 2px; }
        #overlay .draw-toolbar input[type=range] { width: 80px; accent-color: #FFD700; }
        .missing { color: #e57373; font-style: italic; }
        .placeholder { color: #999; font-style: italic; text-align: center; padding: 60px 20px; }
        footer { text-align: center; padding: 30px; color: #666; font-size: 0.9em; }
        .homework-header {
            position: relative;
            flex-wrap: wrap;
            gap: 10px;
        }
        .music-player {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 4px 14px 4px 6px;
        }
        .music-player .m-btn {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            line-height: 1;
        }
        .music-player .m-btn:hover { background: rgba(255,255,255,0.25); }
        .music-player .m-btn.play-btn {
            width: 36px;
            height: 36px;
            font-size: 20px;
            background: rgba(255,255,255,0.2);
        }
        .music-player .m-btn.play-btn:hover { background: rgba(255,255,255,0.4); }
        .music-player .song-info {
            color: rgba(255,255,255,0.9);
            font-size: 12px;
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-left: 2px;
        }
    </style>
</head>
<body>
<audio id="bg-music-file" src="" loop preload="auto"></audio><script>
const musicList = ["一棵小葱&张曦匀-壁上观.mp3", "刘珂矣-半壶纱.mp3", "周杰伦-发如雪.mp3", "周杰伦-红尘客栈.mp3", "李宇春-梨花香.mp3", "陶喆-十七岁.mp3"];

var musicPlaying = false;
var currentSongIndex = -1;

function pickRandomSong() {
    if (musicList.length === 0) return null;
    var idx = Math.floor(Math.random() * musicList.length);
    currentSongIndex = idx;
    return musicList[idx];
}

function getSongDisplayName(filename) {
    return filename.replace(/^\d+/, '').replace(/\.mp3$/i, '');
}

function playSong(filename) {
    var m = document.getElementById("bg-music-file");
    var info = document.getElementById("song-info");
    m.src = "音乐/" + filename;
    m.play().catch(function(){});
    info.textContent = getSongDisplayName(filename);
    info.title = getSongDisplayName(filename);
    musicPlaying = true;
    updatePlayBtn();
}

function updatePlayBtn() {
    var btn = document.getElementById("play-pause-btn");
    btn.innerHTML = musicPlaying ? "⏸" : "▶";
}

function toggleMusic() {
    var m = document.getElementById("bg-music-file");
    if (musicPlaying) {
        m.pause();
        musicPlaying = false;
        updatePlayBtn();
    } else {
        if (currentSongIndex < 0) {
            var song = pickRandomSong();
            if (!song) return;
            playSong(song);
        } else {
            m.play().catch(function(){});
            musicPlaying = true;
            updatePlayBtn();
        }
    }
}

function nextSong() {
    if (musicList.length === 0) return;
    var nextIdx = (currentSongIndex + 1) % musicList.length;
    currentSongIndex = nextIdx;
    playSong(musicList[nextIdx]);
}

function prevSong() {
    if (musicList.length === 0) return;
    var prevIdx = (currentSongIndex - 1 + musicList.length) % musicList.length;
    currentSongIndex = prevIdx;
    playSong(musicList[prevIdx]);
}
</script>
    <header>
        <img src="透明奋斗图.png" class="header-bg-img" alt="">
        <div class="header-content">
            <div class="motto">以梦为马 &nbsp;不负韶华</div>
            <div class="header-bottom-border"></div>
        </div>
    </header>
    <div id="overlay" onclick="if(event.target===this)closeZoom()">
        <canvas id="drawCanvas"></canvas>
        <span class="close-btn" onclick="closeZoom()">&times;</span>
        <div class="draw-toolbar" id="drawToolbar" style="display:none;">
            <button class="dt-btn" id="dtPen" onclick="setTool('pen')">✏️ 画笔</button>
            <button class="dt-btn" id="dtHighlighter" onclick="setTool('highlighter')">🖍️ 荧光笔</button>
            <button class="dt-btn" id="dtEraser" onclick="setTool('eraser')">🧹 橡皮</button>
            <input type="color" id="dtColor" value="#FF0000" onchange="updateColor()" title="颜色">
            <input type="range" id="dtSize" min="1" max="20" value="3" oninput="updateSize()" title="粗细">
            <button class="dt-btn" onclick="clearCanvas()">🗑️ 清除</button>
        </div>
        <div class="img-wrapper">
            <div class="zoom-bar">
                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <span class="zoom-level" id="zoomLevel">100%</span>
                <button class="zoom-btn" onclick="zoomIn()">+</button>
            </div>
            <img id="zoomed-img" src="" alt="">
            <div class="nav-bar">
                <button class="nav-btn" id="prevBtn" onclick="prevImg()">&#9664; 上一页</button>
                <span class="page-indicator" id="pageIndicator">1 / 1</span>
                <button class="nav-btn" id="nextBtn" onclick="nextImg()">下一页 &#9654;</button>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="two-columns">
            <div class="card">
                <div class="card-header homework-header">
                    <span>&#128221;</span><span>作业布置</span>
                                        <div class="music-player">
                        <button class="m-btn" onclick="prevSong()" title="上一首">⏮</button>
                        <button class="m-btn play-btn" id="play-pause-btn" onclick="toggleMusic()" title="播放/暂停">▶</button>
                        <button class="m-btn" onclick="nextSong()" title="下一首">⏭</button>
                        <span class="song-info" id="song-info" title="">未播放</span>
                    </div>
                </div>
                <div class="card-body">
                        <h3>今日作业（）</h3>
                        <div class="hw-text">（1）<br>（2）</div>
                        <h3>近期学习任务</h3>
                        <div class="hw-text">（1）<br>（2）<br>（3）<br>（4）7.8和7.9→期末考试(选修1+2+3)<br>（5）<br>（6）<br>（7）<br>（8）</div>

                </div>
            </div>
            <div class="card">
                <div class="card-header answer-header">
                    <span>&#9989;</span><span>答案核对</span>
                </div>
                <div class="card-body">
                    <div class="answer-content">
                        <div class="answer-item">
                            <img src="答案1.jpg" class="zoom-img" onclick="openGallery(0)">
                        </div>
                        <div class="answer-item">
                            <img src="答案2.jpg" class="zoom-img" onclick="openGallery(1)">
                        </div>
                        <div class="answer-item">
                            <img src="答案3.jpg" class="zoom-img" onclick="openGallery(2)">
                        </div>
                        <div class="answer-item">
                            <img src="答案4.jpg" class="zoom-img" onclick="openGallery(3)">
                        </div>
                        <div class="answer-item">
                            <img src="答案5.jpg" class="zoom-img" onclick="openGallery(4)">
                        </div>
                        <div class="answer-item">
                            <img src="答案6.jpg" class="zoom-img" onclick="openGallery(5)">
                        </div>
                        <div class="answer-item">
                            <img src="答案7.jpg" class="zoom-img" onclick="openGallery(6)">
                        </div>
                        <div class="answer-item">
                            <img src="答案8.jpg" class="zoom-img" onclick="openGallery(7)">
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>桐城中学 · 物理教学组</p>
        <p>&copy; 2026 叶老师</p>
    </footer>
    <script>
    const answerImages = ['答案1.jpg', '答案2.jpg', '答案3.jpg', '答案4.jpg', '答案5.jpg', '答案6.jpg', '答案7.jpg', '答案8.jpg'];
    let currentIndex = 0;
    let currentZoom = 1.0;

    // ===== 绘制功能（全屏canvas）=====
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let drawTool = 'pen';        // pen | highlighter | eraser
    let drawColor = '#FF0000';
    let drawSize = 3;

    function resizeCanvas() {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.putImageData(data, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function setTool(tool) {
        drawTool = tool;
        document.getElementById('dtPen').classList.toggle('active', tool === 'pen');
        document.getElementById('dtHighlighter').classList.toggle('active', tool === 'highlighter');
        document.getElementById('dtEraser').classList.toggle('active', tool === 'eraser');
    }

    function updateColor() {
        drawColor = document.getElementById('dtColor').value;
    }

    function updateSize() {
        drawSize = parseInt(document.getElementById('dtSize').value);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('mousedown', function(e) {
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(e.clientX, e.clientY);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (drawTool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = drawSize * 3;
        } else if (drawTool === 'highlighter') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor + '60';
            ctx.lineWidth = drawSize * 4;
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor;
            ctx.lineWidth = drawSize;
        }
    });

    canvas.addEventListener('mousemove', function(e) {
        if (!drawing) return;
        ctx.lineTo(e.clientX, e.clientY);
        ctx.stroke();
    });

    canvas.addEventListener('mouseup', function() { drawing = false; });
    canvas.addEventListener('mouseleave', function() { drawing = false; });

    // 触摸支持
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        drawing = true;
        const t = e.touches[0];
        ctx.beginPath();
        ctx.moveTo(t.clientX, t.clientY);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (drawTool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = drawSize * 3;
        } else if (drawTool === 'highlighter') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor + '60';
            ctx.lineWidth = drawSize * 4;
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor;
            ctx.lineWidth = drawSize;
        }
    });

    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!drawing) return;
        const t = e.touches[0];
        ctx.lineTo(t.clientX, t.clientY);
        ctx.stroke();
    });

    canvas.addEventListener('touchend', function() { drawing = false; });

    function openGallery(index) {
        currentIndex = index;
        currentZoom = 1.0;
        document.getElementById('overlay').classList.add('show');
        document.getElementById('drawToolbar').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        showImage(index);
    }

    function showImage(index) {
        const img = document.getElementById('zoomed-img');
        img.style.transform = 'scale(1)';
        img.onload = function() {
            img.style.transform = 'scale(' + currentZoom + ')';
        };
        img.src = answerImages[index];
        document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
        const total = answerImages.length;
        document.getElementById('pageIndicator').textContent = (index + 1) + ' / ' + total;
        document.getElementById('prevBtn').disabled = (index === 0);
        document.getElementById('nextBtn').disabled = (index === total - 1);
    }

    function zoomIn() {
        if (currentZoom < 3) {
            currentZoom += 0.25;
            document.getElementById('zoomed-img').style.transform = 'scale(' + currentZoom + ')';
            document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
        }
    }

    function zoomOut() {
        if (currentZoom > 0.5) {
            currentZoom -= 0.25;
            document.getElementById('zoomed-img').style.transform = 'scale(' + currentZoom + ')';
            document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
        }
    }

    function nextImg() {
        if (currentIndex < answerImages.length - 1) {
            currentIndex++;
            currentZoom = 1.0;
            showImage(currentIndex);
        }
    }

    function prevImg() {
        if (currentIndex > 0) {
            currentIndex--;
            currentZoom = 1.0;
            showImage(currentIndex);
        }
    }

    function closeZoom() {
        document.getElementById('overlay').classList.remove('show');
        document.getElementById('drawToolbar').style.display = 'none';
        document.body.style.overflow = '';
        clearCanvas();
    }

    document.addEventListener('keydown', function(e) {
        const overlay = document.getElementById('overlay');
        if (!overlay.classList.contains('show')) return;
        if (e.key === 'Escape') closeZoom();
        if (e.key === 'ArrowRight') nextImg();
        if (e.key === 'ArrowLeft') prevImg();
        if (e.key === '+' || e.key === '=') { zoomIn(); e.preventDefault(); }
        if (e.key === '-') { zoomOut(); e.preventDefault(); }
        if (e.key === 'd' || e.key === 'D') {
            const tb = document.getElementById('drawToolbar');
            tb.style.display = tb.style.display === 'none' ? 'flex' : 'none';
        }
    });
    </script>
</body>
</html>
