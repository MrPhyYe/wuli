    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            line-height: 1.8;
            color: #333;
            background: #f0f2f5;

        }
        header {
            text-align: center;
            padding: 0;
            background: linear-gradient(135deg, #5c0000 0%, #8B0000 20%, #C41E3A 50%, #8B0000 80%, #5c0000 100%);
            color: white;
            position: relative;
            overflow: hidden;
            min-height: 166px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(139,0,0,0.5);
        }
        /* 红金纹理背景 */
        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(255,215,0,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(255,215,0,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(255,100,0,0.1) 0%, transparent 60%);
            pointer-events: none;
        }
        /* 顶部装饰线 */
        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
        }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9999; justify-content: center; align-items: center; }
        #overlay.show { display: flex; }

        #overlay .img-viewport { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        #overlay .img-viewport:active { cursor: default; }
        #overlay img { max-width: none; max-height: none; object-fit: contain; border-radius: 4px; cursor: inherit; transition: transform 0.1s; position: absolute; user-select: none; pointer-events: none; z-index: 1; }
        /* 滚动条样式 - 带箭头细长型 */
        #overlay .scrollbar-v { position: absolute; right: 6px; top: 6px; bottom: 6px; width: 16px; background: rgba(240,240,240,0.9); border: 1px solid #aaa; border-radius: 3px; display: none; z-index: 50; user-select: none; }
        #overlay .scrollbar-h { position: absolute; bottom: 6px; left: 6px; right: 6px; height: 16px; background: rgba(240,240,240,0.9); border: 1px solid #aaa; border-radius: 3px; display: none; z-index: 50; user-select: none; }

        #overlay .scroll-track { position: absolute; background: rgba(240,240,240,0.9); }

<body>
<audio id="bg-music-file" src="" loop preload="auto"></audio><script>
const musicList = ["一棵小葱&张曦匀-壁上观.mp3", "刘珂矣-半壶纱.mp3", "周杰伦-发如雪.mp3", "周杰伦-红尘客栈.mp3", "李宇春-梨花香.mp3", "陶喆-十七岁.mp3"];

var musicPlaying = false;
var currentSongIndex = -1;

function pickRandomSong() {
    if (musicList.length === 0) return null;
    var idx = Math.floor(Math.random() * musicList.length);
    currentSongIndex = idx;
    return musicList[idx];
}

function getSongDisplayName(filename) {
    return filename.replace(/^\d+/, '').replace(/\.mp3$/i, '');
}

function playSong(filename) {
    var m = document.getElementById("bg-music-file");
    var info = document.getElementById("song-info");
    m.src = "音乐/" + filename;
    m.play().catch(function(){});
    info.textContent = getSongDisplayName(filename);
    info.title = getSongDisplayName(filename);
    musicPlaying = true;
    updatePlayBtn();
}

function updatePlayBtn() {
    var btn = document.getElementById("play-pause-btn");
    btn.innerHTML = musicPlaying ? "⏸" : "▶";
}

function toggleMusic() {
    var m = document.getElementById("bg-music-file");
    if (musicPlaying) {
        m.pause();
        musicPlaying = false;
        updatePlayBtn();
    } else {
        if (currentSongIndex < 0) {
            var song = pickRandomSong();
            if (!song) return;
            playSong(song);
        } else {
            m.play().catch(function(){});
            musicPlaying = true;
            updatePlayBtn();
        }
    }
}

function nextSong() {
    if (musicList.length === 0) return;
    var nextIdx = (currentSongIndex + 1) % musicList.length;
    currentSongIndex = nextIdx;
    playSong(musicList[nextIdx]);
}

function prevSong() {
    if (musicList.length === 0) return;
    var prevIdx = (currentSongIndex - 1 + musicList.length) % musicList.length;
    currentSongIndex = prevIdx;
    playSong(musicList[prevIdx]);
}
</script>

    <script>
    const answerImages = ['答案/答案1.jpg', '答案/答案2.jpg', '答案/答案3.jpg', '答案/答案5.jpg', '答案/答案6.jpg', '答案/答案7.jpg', '答案/答案9.jpg', '答案/答案10.jpg', '答案/答案11.jpg', '答案/答案13.jpg', '答案/答案14.jpg', '答案/答案15.jpg'];
    let currentIndex = 0;
    let currentZoom = 2.0;
    let imgOffsetX = 0;
    let imgOffsetY = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragStartOffsetX = 0;
    let dragStartOffsetY = 0;

    // ===== 绘制功能（全屏canvas）=====
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let drawTool = 'pen';        // pen | highlighter | eraser
    let drawColor = '#FF0000';
    let drawSize = 3;

    function resizeCanvas() {
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.putImageData(data, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 禁止右键菜单
    canvas.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    function setTool(tool) {
        // 选中当前工具，不支持取消（去除toggle-off逻辑）
        drawTool = tool;
        document.getElementById('dtPen').classList.toggle('active', tool === 'pen');
        document.getElementById('dtHighlighter').classList.toggle('active', tool === 'highlighter');
        document.getElementById('dtEraser').classList.toggle('active', tool === 'eraser');
        // 允许canvas接收绘制事件
        canvas.style.cursor = 'crosshair';
        canvas.style.pointerEvents = 'auto';
    }

    function updateColor() {
        drawColor = document.getElementById('dtColor').value;
    }

    function updateSize() {
        drawSize = parseInt(document.getElementById('dtSize').value);
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('mousedown', function(e) {
        drawing = true;
        // 画笔模式下改变视口光标
        document.getElementById('imgViewport').style.cursor = 'default';
        ctx.beginPath();
        ctx.moveTo(e.clientX, e.clientY);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (drawTool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = drawSize * 3;
        } else if (drawTool === 'highlighter') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor + '60';
            ctx.lineWidth = drawSize * 4;
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor;
            ctx.lineWidth = drawSize;
        }
    });

    canvas.addEventListener('mousemove', function(e) {
        // 绘制时保持默认光标
        if (drawing) {
            canvas.style.cursor = 'default';
        }
        if (!drawing) return;
        ctx.lineTo(e.clientX, e.clientY);
        ctx.stroke();
    });

    // 鼠标进入 canvas 时检查光标
    canvas.addEventListener('mouseenter', function() {
        if (drawing) {
            canvas.style.cursor = 'default';
        }
    });

    canvas.addEventListener('mouseup', function() {
        drawing = false;
    });
    canvas.addEventListener('mouseleave', function() {
        drawing = false;
    });

    // 触摸支持
    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        drawing = true;
        document.getElementById('imgViewport').style.cursor = 'default';
        const t = e.touches[0];
        ctx.beginPath();
        ctx.moveTo(t.clientX, t.clientY);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (drawTool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = drawSize * 3;
        } else if (drawTool === 'highlighter') {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor + '60';
            ctx.lineWidth = drawSize * 4;
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = drawColor;
            ctx.lineWidth = drawSize;
        }
    });

    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!drawing) return;
        const t = e.touches[0];
        ctx.lineTo(t.clientX, t.clientY);
        ctx.stroke();
    });

    canvas.addEventListener('touchend', function() {
        drawing = false;
    });

    function openGallery(index) {
        currentIndex = index;
        currentZoom = 2.0;
        document.getElementById('overlay').classList.add('show');
        document.getElementById('drawToolbar').style.display = 'flex';
        document.body.style.overflow = 'hidden';
        showImage(index);
    }

    function updateImageTransform() {
        const img = document.getElementById('zoomed-img');
        img.style.transform = 'scale(' + currentZoom + ') translate(' + imgOffsetX + 'px, ' + imgOffsetY + 'px)';
    }

    function constrainOffset() {
        const img = document.getElementById('zoomed-img');
        const viewport = document.getElementById('imgViewport');
        if (!img || !viewport) return;
        
        const rect = img.getBoundingClientRect();
        const vpRect = viewport.getBoundingClientRect();
        
        // 计算图片实际显示尺寸
        const scaledWidth = rect.width;
        const scaledHeight = rect.height;
        
        // 如果图片小于视口，居中显示
        if (scaledWidth <= vpRect.width) {
            imgOffsetX = 0;
        } else {
            // 限制偏移范围，确保边缘不会进入视口内太多
            const maxOffset = (scaledWidth - vpRect.width) / (2 * currentZoom);
            imgOffsetX = Math.max(-maxOffset, Math.min(maxOffset, imgOffsetX));
        }
        
        if (scaledHeight <= vpRect.height) {
            imgOffsetY = 0;
        } else {
            const maxOffset = (scaledHeight - vpRect.height) / (2 * currentZoom);
            imgOffsetY = Math.max(-maxOffset, Math.min(maxOffset, imgOffsetY));
        }
    }

    function showImage(index) {
        const img = document.getElementById('zoomed-img');
        const viewport = document.getElementById('imgViewport');
        const scrollbarV = document.getElementById('scrollbarV');
        const scrollbarH = document.getElementById('scrollbarH');
        currentZoom = 2.0;
        imgOffsetX = 0;
        imgOffsetY = 0;
        img.onload = function() {
            imgNaturalWidth = img.naturalWidth;
            imgNaturalHeight = img.naturalHeight;
            imgViewportW = viewport.clientWidth;
            imgViewportH = viewport.clientHeight;
            updateScrollbar();
            updateImageTransform();
        };
        img.src = answerImages[index];
        document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
        const total = answerImages.length;
        document.getElementById('pageIndicator').textContent = (index + 1) + ' / ' + total;
        document.getElementById('prevBtn').disabled = (index === 0);
        document.getElementById('nextBtn').disabled = (index === total - 1);
        updateImageTransform();
    }

    function updateScrollbar() {
        const scrollbarV = document.getElementById('scrollbarV');
        const scrollbarH = document.getElementById('scrollbarH');
        const thumbV = document.getElementById('scrollThumbV');
        const thumbH = document.getElementById('scrollThumbH');
        
        const scaledW = imgNaturalWidth * currentZoom;
        const scaledH = imgNaturalHeight * currentZoom;
        const showV = scaledH > imgViewportH;
        const showH = scaledW > imgViewportW;
        
        scrollbarV.style.display = showV ? 'block' : 'none';
        scrollbarH.style.display = showH ? 'block' : 'none';
        
        // 计算thumb大小
        if (showV) {
            const trackH = scrollbarV.querySelector('.scroll-track').clientHeight;
            const thumbH_px = Math.max(20, trackH * (imgViewportH / scaledH));
            thumbV.style.height = thumbH_px + 'px';
            // 设置thumb位置
            const maxOffsetY = (scaledH - imgViewportH) / 2 / currentZoom;
            if (maxOffsetY > 0) {
                const pos = (imgOffsetY + maxOffsetY) / (2 * maxOffsetY);
                const trackTop = scrollbarV.querySelector('.scroll-track').offsetTop;
                thumbV.style.top = (trackTop + pos * (trackH - thumbH_px)) + 'px';
            }
        }
        if (showH) {
            const trackW = scrollbarH.querySelector('.scroll-track').clientWidth;
            const thumbW_px = Math.max(20, trackW * (imgViewportW / scaledW));
            thumbH.style.width = thumbW_px + 'px';
            const maxOffsetX = (scaledW - imgViewportW) / 2 / currentZoom;
            if (maxOffsetX > 0) {
                const pos = (imgOffsetX + maxOffsetX) / (2 * maxOffsetX);
                const trackLeft = scrollbarH.querySelector('.scroll-track').offsetLeft;
                thumbH.style.left = (trackLeft + pos * (trackW - thumbW_px)) + 'px';
            }
        }
    }

    function zoomIn() {
        if (currentZoom < 5) {
            currentZoom += 0.25;
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
            document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
        }
    }

    function zoomOut() {
        if (currentZoom > 1.0) {
            currentZoom -= 0.25;
            if (currentZoom <= 1.0) {
                imgOffsetX = 0;
                imgOffsetY = 0;
            }
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
            document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
        }
    }

    function nextImg() {
        if (currentIndex < answerImages.length - 1) {
            currentIndex++;
            currentZoom = 2.0;
            showImage(currentIndex);
        }
    }

    function prevImg() {
        if (currentIndex > 0) {
            currentIndex--;
            currentZoom = 2.0;
            showImage(currentIndex);
        }
    }

    // 拖拽功能已移除，改用滑动条
    function initDrag() {}

    function closeZoom() {
        document.getElementById('overlay').classList.remove('show');
        document.getElementById('drawToolbar').style.display = 'none';
        document.body.style.overflow = '';
        clearCanvas();
        imgOffsetX = 0;
        imgOffsetY = 0;
        currentZoom = 2.0;
        canvas.style.pointerEvents = 'none';
    }

    // 滚动条拖动功能
    let isScrollbarDragging = false;
    function initScrollbar() {
        const scrollbarV = document.getElementById('scrollbarV');
        const scrollbarH = document.getElementById('scrollbarH');
        const thumbV = document.getElementById('scrollThumbV');
        const thumbH = document.getElementById('scrollThumbH');
        const scrollUp = document.getElementById('scrollUp');
        const scrollDown = document.getElementById('scrollDown');
        const scrollLeft = document.getElementById('scrollLeft');
        const scrollRight = document.getElementById('scrollRight');
        let isDragV = false, isDragH = false;
        let startY = 0, startX = 0;
        let startOffsetY = 0, startOffsetX = 0;

        // 拖动时阻止click事件关闭overlay
        document.addEventListener('click', function(e) {
            if (isScrollbarDragging) {
                e.stopPropagation();
                e.preventDefault();
            }
        }, true);

        function getMaxOffsetY() {
            const scaledH = imgNaturalHeight * currentZoom;
            return Math.max(0, (scaledH - imgViewportH) / 2 / currentZoom);
        }
        function getMaxOffsetX() {
            const scaledW = imgNaturalWidth * currentZoom;
            return Math.max(0, (scaledW - imgViewportW) / 2 / currentZoom);
        }

        // 箭头点击
        scrollUp.addEventListener('click', function(e) {
            e.stopPropagation();
            imgOffsetY = Math.min(getMaxOffsetY(), imgOffsetY + 30 / currentZoom);
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
        });
        scrollDown.addEventListener('click', function(e) {
            e.stopPropagation();
            imgOffsetY = Math.max(-getMaxOffsetY(), imgOffsetY - 30 / currentZoom);
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
        });
        scrollLeft.addEventListener('click', function(e) {
            e.stopPropagation();
            imgOffsetX = Math.min(getMaxOffsetX(), imgOffsetX + 30 / currentZoom);
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
        });
        scrollRight.addEventListener('click', function(e) {
            e.stopPropagation();
            imgOffsetX = Math.max(-getMaxOffsetX(), imgOffsetX - 30 / currentZoom);
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
        });

        // 阻止canvas在滚动条上画字
        scrollbarV.addEventListener('mousedown', function(e) { e.stopPropagation(); });
        scrollbarH.addEventListener('mousedown', function(e) { e.stopPropagation(); });

        // thumb拖动
        thumbV.addEventListener('mousedown', function(e) {
            isDragV = true;
            isScrollbarDragging = true;
            startY = e.clientY;
            startOffsetY = imgOffsetY;
            e.stopPropagation();
            e.preventDefault();
        });

        thumbH.addEventListener('mousedown', function(e) {
            isDragH = true;
            isScrollbarDragging = true;
            startX = e.clientX;
            startOffsetX = imgOffsetX;
            e.stopPropagation();
            e.preventDefault();
        });

        // 轨道点击跳转
        scrollbarV.querySelector('.scroll-track').addEventListener('mousedown', function(e) {
            if (e.target === thumbV) return;
            isScrollbarDragging = true;
            const track = e.currentTarget;
            const trackRect = track.getBoundingClientRect();
            const thumbH_val = thumbV.clientHeight;
            const ratio = (e.clientY - trackRect.top - thumbH_val/2) / (trackRect.height - thumbH_val);
            const maxOffset = getMaxOffsetY();
            imgOffsetY = maxOffset * (ratio * 2 - 1);
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
            setTimeout(function() { isScrollbarDragging = false; }, 100);
            e.stopPropagation();
            e.preventDefault();
        });

        scrollbarH.querySelector('.scroll-track').addEventListener('mousedown', function(e) {
            if (e.target === thumbH) return;
            isScrollbarDragging = true;
            const track = e.currentTarget;
            const trackRect = track.getBoundingClientRect();
            const thumbW_val = thumbH.clientWidth;
            const ratio = (e.clientX - trackRect.left - thumbW_val/2) / (trackRect.width - thumbW_val);
            const maxOffset = getMaxOffsetX();
            imgOffsetX = maxOffset * (ratio * 2 - 1);
            constrainOffset();
            updateImageTransform();
            updateScrollbar();
            setTimeout(function() { isScrollbarDragging = false; }, 100);
            e.stopPropagation();
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (isDragV) {
                const track = scrollbarV.querySelector('.scroll-track');
                const trackRect = track.getBoundingClientRect();
                const thumbH_val = thumbV.clientHeight;
                const dy = e.clientY - startY;
                const ratio = dy / (trackRect.height - thumbH_val);
                const maxOffset = getMaxOffsetY();
                imgOffsetY = startOffsetY + maxOffset * 2 * ratio;
                constrainOffset();
                updateImageTransform();
                updateScrollbar();
            }
            if (isDragH) {
                const track = scrollbarH.querySelector('.scroll-track');
                const trackRect = track.getBoundingClientRect();
                const thumbW_val = thumbH.clientWidth;
                const dx = e.clientX - startX;
                const ratio = dx / (trackRect.width - thumbW_val);
                const maxOffset = getMaxOffsetX();
                imgOffsetX = startOffsetX + maxOffset * 2 * ratio;
                constrainOffset();
                updateImageTransform();
                updateScrollbar();
            }
        });

        document.addEventListener('mouseup', function() {
            if (isDragV || isDragH) {
                isDragV = false;
                isDragH = false;
                // 延迟清除，让后续的 click 事件能检测到
                setTimeout(function() { isScrollbarDragging = false; }, 100);
            }
        });
    }

    let imgNaturalWidth = 0, imgNaturalHeight = 0;
    let imgViewportW = 0, imgViewportH = 0;

    // 初始化拖拽
    initDrag();
    initScrollbar();

    document.addEventListener('keydown', function(e) {
        const overlay = document.getElementById('overlay');
        if (!overlay.classList.contains('show')) return;
        if (e.key === 'Escape') closeZoom();
        if (e.key === 'ArrowRight') nextImg();
        if (e.key === 'ArrowLeft') prevImg();
        if (e.key === '+' || e.key === '=') { zoomIn(); e.preventDefault(); }
        if (e.key === '-') { zoomOut(); e.preventDefault(); }
        if (e.key === 'd' || e.key === 'D') {
            const tb = document.getElementById('drawToolbar');
            tb.style.display = tb.style.display === 'none' ? 'flex' : 'none';
        }
    });
    </script>
</body>
